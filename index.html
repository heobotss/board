<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>비브레피티 팀 보드</title>
<style>
:root{--bg:#F1F3F1;--card:#fff;--ink:#151B19;--soft:#4A5551;--rule:#D8DEDA;--teal:#0F6E62;--red:#9F1D1D}
@media (prefers-color-scheme:dark){:root{--bg:#0D1412;--card:#161F1C;--ink:#E9EFEC;--soft:#A7B4AE;--rule:#28332F;--teal:#3BA893;--red:#E08B82}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic",sans-serif;padding:24px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--rule);border-radius:16px;
  padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--soft);font-size:14px;line-height:1.6}
input[type=password]{font-size:17px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;
  background:var(--bg);color:var(--ink);width:100%}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft)}
button{font-size:16px;font-weight:700;padding:13px;border:0;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.err{color:var(--red);font-size:14px;min-height:1.2em}
</style></head>
<body>
<form id="f">
  <h1>비브레피티 팀 보드</h1>
  <p>센터 내부용입니다. 비밀번호를 넣어 주세요.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
  <label><input id="keep" type="checkbox" checked> 이 기기에서 기억하기</label>
  <button type="submit">열기</button>
  <div class="err" id="err"></div>
</form>

const KEY = "vivre-board-pw";
function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function 풀기(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.s), iterations:D.n, hash:"SHA-256"},
                                            base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.i)}, key, b64(D.c));
  return new TextDecoder().decode(pt);
}
function 보이기(h){ document.open(); document.write(h); document.close(); }
function 저장소(){ try { return window.localStorage; } catch(e) { return null; } }
(async function(){
  const st = 저장소(), saved = st && st.getItem(KEY);
  if (saved) { try { 보이기(await 풀기(saved)); return; } catch(e) { st.removeItem(KEY); } }

    const pw = document.getElementById("pw").value, err = document.getElementById("err");

  });
})();
